# Portfolio Agent Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${K8S_DEPLOYMENT}
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${K8S_DEPLOYMENT}
  template:
    metadata:
      labels:
        app: ${K8S_DEPLOYMENT}
    spec:
      containers:
        - name: ${SERVICE_NAME}
          imagePullPolicy: IfNotPresent
          image: ${IMAGE_REF}
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: ${ENV_SECRET_NAME}
          resources:
            requests:
              cpu: "100m" # 0.1 vCPU guaranteed
              memory: "128Mi" # 128 MiB guaranteed
            limits:
              cpu: "500m" # Max 0.5 vCPU allowed
              memory: "512Mi" # Max 512 MiB allowed
          readinessProbe:
            httpGet:
              path: /api/system/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/system/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      imagePullSecrets:
        - name: ${REG_SECRET_NAME}

---
# Portfolio Agent Service
apiVersion: v1
kind: Service
metadata:
  name: ${K8S_DEPLOYMENT}
  namespace: ${K8S_NAMESPACE}
spec:
  type: NodePort
  selector:
    app: ${K8S_DEPLOYMENT}
  ports:
    - port: 80 # Internal service port
      targetPort: 3001 # Pod/container port
      nodePort: ${NODE_PORT} # NodePort (external port on EC2)
